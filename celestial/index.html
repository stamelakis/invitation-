<!-- Ψηφιακή πρόσκληση γάμου — Ανδρέας & Λίνα · 26.09.2026
     ΒΗΜΑ 1 — ο φάκελος κλειστός· άγγιγμα στο μαργαριτάρι τον ανοίγει.
     Τα υλικά είναι οι πραγματικές φωτογραφίες (celestial/art/), όχι σχέδια. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9dcc6">
<meta name="robots" content="noindex, nofollow">
<title>Ανδρέας &amp; Λίνα — Πρόσκληση Γάμου</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="art/envelope-open.webp">

<style>
/* ─────────────────────────────────────────────────────────────
   Γεωμετρία μετρημένη πάνω στη φωτογραφία (1492 × 1054 px)
   με προσαρμογή κύκλου στο περίγραμμα του χρυσού καπακιού:
   κέντρο  x = 769 px → 51.54 %   ·   y = 624 px → 59.20 %
   ακτίνα καπακιού ≈ 46 px  ·  περιοχή αφής ≈ 63 px (≥ 48 px σε κινητό)
   Όλα τα υπόλοιπα προκύπτουν από αυτούς τους αριθμούς.
   ───────────────────────────────────────────────────────────── */
:root{
  --iw: 1492;            /* πλάτος φωτογραφίας  */
  --ih: 1054;            /* ύψος φωτογραφίας    */
  --ratio: 1.415560;     /* iw / ih             */
  --ihpct: 70.6434;      /* ύψος ως % του πλάτους */

  --px: 51.54;           /* κέντρο μαργαριταριού, % του πλάτους */
  --py: 59.20;           /* κέντρο μαργαριταριού, % του ύψους   */
  --pw: 8.4;             /* διάμετρος κουμπιού, % του πλάτους   */

  /* θέση του φόντου ώστε το καπάκι να πέφτει ακριβώς στο κέντρο του κουμπιού */
  --bgx: calc((var(--pw)/2 - var(--px)) / (var(--pw) - 100) * 100%);
  --bgy: calc((var(--pw)/2 - var(--py)/100*var(--ihpct)) / (var(--pw) - var(--ihpct)) * 100%);

  /* πλάτος της φωτογραφίας στην οθόνη — το μοιράζονται κάδρο και φόντο,
     ώστε να είναι απόλυτα ευθυγραμμισμένα και να μη φαίνεται ραφή */
  --plate: min(96vw, calc(87svh * var(--ratio)));

  --foil:      #a2854f;
  --foil-deep: #7f6739;
  --serif: "Cormorant Garamond","EB Garamond",Palatino,Georgia,serif;
  --ease:  cubic-bezier(.22,.68,.24,1);
}

*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{
  background:#e9dcc6;
  overflow:hidden;
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

.stage{position:fixed; inset:0; overflow:hidden}

/* Το κάδρο: πάντα κεντραρισμένο, ακόμη κι όταν ξεπερνά την οθόνη
   (το grid centering «κολλάει» τα υπερμεγέθη στοιχεία στην άκρη). */
.frame{
  position:absolute; left:50%; top:50%; translate:-50% -50%;
  width:var(--plate); aspect-ratio:var(--iw) / var(--ih);
}
@media (max-aspect-ratio: 1/1){
  :root{ --plate: min(170vw, calc(95svh * var(--ratio))) }
}

/* ── Το σατέν συνεχίζεται πέρα από τη φωτογραφία ──
   Ίδια εικόνα, μεγεθυσμένη και θολή: το φόντο δένει σε κάθε οθόνη
   χωρίς να ζωγραφίσουμε τίποτα καινούργιο. */
.bleed{
  position:absolute; inset:0; z-index:0;
  /* Το σατέν γύρω από το κάδρο, στον ίδιο ακριβώς τόνο με τις άκρες
     της φωτογραφίας (δειγματοληψία: πάνω #c3b1a2, κάτω #b9a595). */
  background:linear-gradient(177deg, #c7b5a6 0%, #c0ad9d 48%, #b6a291 100%);
}
/* θολή η ίδια φωτογραφία από πάνω: δίνει ζωή στο ύφασμα χωρίς να ανοίγει ο τόνος */
.bleed::before{
  content:""; position:absolute; inset:0;
  background:url(art/envelope-closed.webp) no-repeat center;
  background-size:auto calc(var(--plate) / var(--ratio) * 2.15);
  filter:blur(76px) saturate(1.04);
  opacity:.46;
}
.bleed::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(128% 104% at 50% 48%, rgba(0,0,0,0) 62%, rgba(104,82,52,.16) 100%);
}

/* ── Η φωτογραφία ── */
.plate{
  position:absolute; inset:0; z-index:1;
  transition:opacity 1100ms var(--ease), transform 1500ms var(--ease), filter 900ms var(--ease);
}
.plate img{
  display:block; width:100%; height:100%; object-fit:contain;
  /* Οι άκρες σβήνουν μέσα στο θολό σατέν: το κάδρο δεν έχει περίγραμμα,
     η ύφανση απλώς συνεχίζει προς τα έξω. */
  -webkit-mask-image:
     linear-gradient(to right,  rgba(0,0,0,0) 0, #000 4%, #000 96%, rgba(0,0,0,0) 100%),
     linear-gradient(to bottom, rgba(0,0,0,0) 0, #000 5.5%, #000 97%, rgba(0,0,0,0) 100%);
          mask-image:
     linear-gradient(to right,  rgba(0,0,0,0) 0, #000 4%, #000 96%, rgba(0,0,0,0) 100%),
     linear-gradient(to bottom, rgba(0,0,0,0) 0, #000 5.5%, #000 97%, rgba(0,0,0,0) 100%);
  -webkit-mask-composite:source-in;
          mask-composite:intersect;
}

.plate.open{ opacity:0; transform:scale(1.035); pointer-events:none }

/* ═══ ΤΟ ΚΟΥΜΠΙ ΤΟΥ ΜΑΡΓΑΡΙΤΑΡΙΟΥ ═══════════════════════════
   Δεν σχεδιάζεται μαργαριτάρι: το κουμπί κρατά το ίδιο κομμάτι
   της φωτογραφίας, κομμένο σε κύκλο, ώστε το πραγματικό
   μαργαριτάρι να ανασηκώνεται και να πιάνει φως στο άγγιγμα. */
.pearl{
  position:absolute; z-index:3;
  left:calc(var(--px) * 1%); top:calc(var(--py) * 1%);
  width:calc(var(--pw) * 1%); aspect-ratio:1;
  translate:-50% -50%;
  padding:0; border:0; background:none; border-radius:50%;
  cursor:pointer; appearance:none; -webkit-appearance:none;
}
.pearl:disabled{cursor:default}

/* το ίδιο το μαργαριτάρι — αληθινά pixel, όχι γραφικό */
.knot{
  position:absolute; inset:0; border-radius:50%;
  background:url(art/envelope-closed.webp) no-repeat;
  background-size:calc(100% * 100 / var(--pw)) auto;
  background-position:var(--bgx) var(--bgy);
  /* απαλή άκρη: η μεγέθυνση δένει με τη γύρω φωτογραφία, χωρίς ραφή */
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 54%, rgba(0,0,0,0) 100%);
          mask-image:radial-gradient(circle at 50% 50%, #000 54%, rgba(0,0,0,0) 100%);
  transition:transform 520ms var(--ease), filter 520ms var(--ease);
  will-change:transform;
}
.pearl:hover  .knot{ transform:scale(1.055); filter:brightness(1.055) }
.pearl:active .knot{ transform:scale(.988);  filter:brightness(1.02)  }

/* λάμψη που γεννιέται πάνω στο μαργαριτάρι */
.gleam{
  position:absolute; inset:-4%; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 44% 38%,
    rgba(255,253,247,.85) 0%, rgba(255,250,238,.40) 34%, rgba(255,248,232,0) 68%);
  opacity:0; transition:opacity 520ms var(--ease);
}
.pearl:hover .gleam{opacity:.42}

/* δύο δαχτυλίδια φωτός που ανοίγουν προς τα έξω */
.halo{position:absolute; inset:0; pointer-events:none}
.halo i{
  position:absolute; inset:0; border-radius:50%;
  border:1.5px solid rgba(168,138,84,.55);
  box-shadow:0 0 12px rgba(180,150,96,.35), inset 0 0 8px rgba(255,246,226,.5);
  animation:halo 3.6s var(--ease) infinite;
}
.halo i:nth-child(2){animation-delay:1.8s}
@keyframes halo{
  0%   {transform:scale(.94); opacity:0}
  18%  {opacity:.9}
  100% {transform:scale(2.15); opacity:0}
}
.pearl:focus-visible{outline:none}
.pearl:focus-visible .knot{
  box-shadow:0 0 0 2px #fffdf6, 0 0 0 4.5px var(--foil);
}

/* ═══ Λεζάντα ═══ */
.hint{
  position:fixed; z-index:4; left:50%; bottom:max(4svh,22px);
  translate:-50% 0;
  display:flex; flex-direction:column; align-items:center; gap:.85em;
  color:#6d5931;
  font-size:clamp(10.5px,1.2vw,13px);
  letter-spacing:.32em; text-transform:uppercase; font-weight:500;
  text-shadow:
    0 1px 0 rgba(255,253,246,.95), 0 0 6px rgba(255,252,244,.95),
    0 0 16px rgba(255,251,240,.9), 0 0 30px rgba(255,250,236,.7);
  opacity:0; animation:fadeUp 1400ms var(--ease) 900ms forwards;
  transition:opacity 600ms var(--ease), translate 600ms var(--ease);
  pointer-events:none; text-align:center; padding:0 20px;
}
.hint svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.1;
  stroke-linecap:round; stroke-linejoin:round; animation:tap 2.8s var(--ease) infinite}
@keyframes fadeUp{from{opacity:0; translate:-50% 12px} to{opacity:.92; translate:-50% 0}}
@keyframes tap{0%,100%{transform:translateY(0)} 45%{transform:translateY(-6px)}}

/* ═══ Το άνοιγμα ═══ */
body.opening .plate.closed{ opacity:0; transform:scale(1.055); filter:brightness(1.06) }
body.opening .plate.open  { opacity:1; transform:scale(1); pointer-events:auto }
body.opening .hint        { animation:none; opacity:0; translate:-50% 10px }
body.opening .pearl       { pointer-events:none }

/* η αναλαμπή τη στιγμή του αγγίγματος */
.flash{
  position:absolute; z-index:5; left:calc(var(--px) * 1%); top:calc(var(--py) * 1%);
  width:calc(var(--pw) * 1%); aspect-ratio:1; translate:-50% -50%;
  border-radius:50%; pointer-events:none; opacity:0;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,250,236,.6) 30%, rgba(255,246,226,0) 70%);
}
body.opening .flash{ animation:flash 1200ms var(--ease) forwards }
@keyframes flash{
  0%  {opacity:0;  transform:scale(.6)}
  16% {opacity:.95; transform:scale(1.5)}
  100%{opacity:0;  transform:scale(5.5)}
}

/* ═══ Επανάληψη (για δοκιμή) ═══ */
.again{
  position:fixed; z-index:6; left:50%; bottom:max(4svh,22px); translate:-50% 8px;
  padding:11px 26px; border-radius:999px; cursor:pointer;
  font-family:var(--serif); font-size:11px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--foil-deep); background:rgba(255,253,247,.82);
  border:1px solid rgba(162,133,79,.42);
  box-shadow:0 8px 22px -12px rgba(96,74,42,.55);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  opacity:0; visibility:hidden;
  transition:opacity 600ms var(--ease) 1500ms, translate 600ms var(--ease) 1500ms, visibility 0s linear 2100ms;
}
body.opening .again{opacity:1; visibility:visible; translate:-50% 0; transition-delay:1500ms,1500ms,0s}
.again:hover{background:#fffdf7; border-color:rgba(162,133,79,.8)}
.again:focus-visible{outline:2px solid var(--foil); outline-offset:3px}

.sr{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important; animation-iteration-count:1!important;
    transition-duration:120ms!important}
}
</style>

<div class="stage">
  <div class="bleed" aria-hidden="true"></div>
  <div class="frame">

  <!-- ο φάκελος, κλειστός -->
  <div class="plate closed">
    <img src="art/envelope-closed.webp" width="1492" height="1054"
         alt="Ο φάκελος της πρόσκλησης: περλέ κοχύλι δεμένο με κορδέλα και μαργαριτάρι" fetchpriority="high">

    <button class="pearl" id="pearl" type="button" aria-label="Ανοίξτε την πρόσκληση">
      <span class="knot" aria-hidden="true"></span>
      <span class="gleam" aria-hidden="true"></span>
      <span class="halo" aria-hidden="true"><i></i><i></i></span>
    </button>
    <span class="flash" aria-hidden="true"></span>
  </div>

  <!-- Ο φάκελος ανοιχτός.
       ΠΡΟΣΟΧΗ: αυτή η φωτογραφία έχει τυπωμένα τα δείγματα ονομάτων του
       style sheet (Στέφανος & Ιόλη, 28.06.2027). Χρειάζεται είτε νέο render
       με τα αληθινά στοιχεία, είτε λευκές κάρτες ώστε να μπει από πάνω το
       πραγματικό κείμενο. Μπαίνει εδώ προσωρινά, για να δουλέψει το άνοιγμα. -->
  <div class="plate open" id="opened">
    <img src="art/envelope-open.webp" width="1492" height="1054"
         alt="Η πρόσκληση ανοιχτή: το κοχύλι, οι δύο κάρτες και η κορδέλα" loading="eager" decoding="async">
  </div>

  </div><!-- /.frame -->

  <p class="hint" id="hint">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V6a2 2 0 0 1 4 0v5m0-2a2 2 0 0 1 4 0v3m0-1a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.5L6 16"/></svg>
    Αγγίξτε το μαργαριτάρι
  </p>

  <button class="again" id="again" type="button">Ξανά</button>
</div>

<script>
(function(){
  var pearl = document.getElementById('pearl'),
      again = document.getElementById('again'),
      body  = document.body;

  function open(){
    if(body.classList.contains('opening')) return;
    body.classList.add('opening');
    pearl.setAttribute('aria-expanded','true');
    pearl.disabled = true;
    setTimeout(function(){ again.focus({preventScroll:true}); }, 2200);
  }
  function close(){
    body.classList.remove('opening');
    pearl.setAttribute('aria-expanded','false');
    pearl.disabled = false;
    pearl.focus({preventScroll:true});
  }

  pearl.setAttribute('aria-expanded','false');
  pearl.addEventListener('click', open);
  again.addEventListener('click', close);
})();
</script>
